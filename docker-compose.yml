services:
  whisper-api:
    build: .
    container_name: whisper-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - XDG_CACHE_HOME=/cache
    volumes:
      - whisper-cache:/cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

volumes:
  whisper-cache:
