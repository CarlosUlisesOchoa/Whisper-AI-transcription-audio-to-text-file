# Copy this file to watch-config.yaml (gitignored — contains local machine paths)
# and edit the `watch` list below to point at your Google Drive folders.

api:
  base_url: http://127.0.0.1:8000
  # API key is read from the API_KEY env var / .env — never stored in this file.
  enabled: true                  # false = no automatic scanning; manual triggers via POST /watcher/trigger still work
  poll_interval_seconds: 3600    # how often each root is automatically rescanned (default: hourly)
  control_check_seconds: 5       # how often to check for a manual-trigger signal, independent of the above
  stability_seconds: 60          # a file must be size-stable this long before submission
  job_poll_seconds: 10           # how often an in-flight job is polled
  job_timeout_seconds: 14400     # 4h ceiling — a ~2h file must fit comfortably
  max_inflight: 1                # outstanding jobs at once
  max_files_per_cycle: 5         # backlog throttle
  order: newest_first            # newest_first | oldest_first
  max_attempts: 5                # give up (mark failed, stop retrying) after this many failures
  backoff_base_seconds: 60       # first retry delay; doubles each attempt (exponential backoff)
  backoff_max_seconds: 3600      # cap on the backoff delay
  explorer_refresh: true         # force a Windows shell (Explorer) enumeration of each root before walking it
                                  # — Google Drive's virtual filesystem can leave a folder's listing stale
                                  # until the shell touches it; requires pywin32 (see requirements-watcher.txt)
  explorer_settle_seconds: 3     # only used by the visible-Explorer fallback, if the headless COM path fails
  startup_delay_seconds: 30      # grace period before the first readiness re-check at startup
  root_wait_timeout_seconds: 300 # stop waiting for missing roots and scan anyway after this
  root_wait_poll_seconds: 5      # how often missing roots are re-checked while waiting
  unavailable_retry_seconds: 60  # next-scan interval after a tick where any root was unavailable (instead of poll_interval_seconds)
  drive_autostart: true          # launch Google Drive (launch.bat) if roots are missing at startup — Windows only
  drive_launcher: ""             # explicit path to launch.bat / GoogleDriveFS.exe; empty = auto-detect via registry
  api_wait_timeout_seconds: 300  # bounded wait on GET /health at startup before the first tick; 0 disables

watch:
  - path: "G:\\Mi unidad\\Documents GDrive\\Voice Memos Work\\test"
    recursive: true
    language: es
    align: true
    diarize: true
    enroll_unknown: true

  # Add more roots here; each carries its own language and flags.
  # - path: "G:\\Mi unidad\\Documents GDrive\\Some Other Folder"
  #   recursive: false
  #   language: en
  #   align: true
  #   diarize: true
  #   enroll_unknown: false
  #   explorer_refresh: false    # e.g. a purely local (non-Drive) root doesn't need the shell refresh
